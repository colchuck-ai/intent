name: Release

# A release is a tag. Nothing else triggers this workflow; tags with a
# pre-release suffix (v0.3.0-rc.1) are published as GitHub pre-releases via
# .goreleaser.yaml's release.prerelease: auto.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # goreleaser derives the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4

      # The tag is not a release until it passes the same gate every commit
      # does on CI, run again here in case the tagged commit predates that
      # run or was tagged out of band.
      - name: go test
        run: go test ./...

      - name: go build
        run: go build -o bin/intent ./cmd/intent

      - name: intent validate
        run: ./bin/intent validate

      - name: intent check
        run: ./bin/intent check

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: go test
        run: go test ./...

      - name: go build
        run: go build -o bin/intent ./cmd/intent

      - name: intent validate
        run: ./bin/intent validate -f internal/model/testdata/seed.intent.yaml

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: intent
    main: ./cmd/intent
    binary: intent
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/colchuck-ai/intent/internal/cli.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: colchuck-ai
    name: intent

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

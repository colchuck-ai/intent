architecture:
  title: Intent
  summary: "Intent is delivered as a set of files an AI assistant loads at runtime — a skill definition, reference guides, document templates, and a validation script — that together teach the assistant how to place, draft, and check product and engineering documentation."
  principles:
    - "Default every element to the lowest tier (an inline statement) and promote only when a concrete need forces it — never scaffold structure ahead of need."
    - "Keep documents (current state) and records (history and rationale) in separate files; a document and its records never share a file."
    - "Make every element resolvable by a stable logical ID before any file exists for it."
  constraints:
    - "Records live only in the four central directories (`docs/product/crs/`, `docs/product/drs/`, `docs/engineering/crs/`, `docs/engineering/drs/`) — never inline, never in a per-element folder."
    - "Slugs carry only the local ID segment; ancestor context comes from the directory path, not the slug."
  technologyChoices:
    - "Markdown files under `docs/`: human- and agent-readable, diffable in git, no runtime or database needed to operate."
    - "Python standard library (PEP 723, no external deps) for the linter script: runs anywhere Python 3 runs with no install step, so it can run as the mechanical first pass before human judgment in the Judge loop."

components:
  - id: C001
    name: Skill Definition
    responsibility: "Declares Intent's activation triggers, principles, gotchas, and the reference index an assistant loads to operate the framework."
    fulfills: [O001-R001]
    relationships:
      - to: C002
        note: "points into the reference guides for full rules rather than restating them."
      - to: C004
        note: "lists the linter under \"Available scripts\" as the mechanical first pass for the Judge loop."
  - id: C002
    name: Reference Guides
    responsibility: "Defines what each element is, where it lives, how to modify it, and what context to trace, across `elements.md`, `structure.md`, `workflows.md`, and `context-tracing.md`."
    fulfills: [O001-R001, O001-R002, O002-R001, O002-R002, O003-R001, O003-R002]
    relationships:
      - to: C003
        note: "the paths and tiers defined here are what the templates instantiate."
  - id: C003
    name: Templates
    responsibility: "Provides one canonical per-element × tier document skeleton, fixing required vs. omittable sections and the inline-vs-reference child rendering form."
    fulfills: [O002-R002, O003-R002]
    relationships:
      - to: C002
        note: "each template implements the paths and tier rules defined there."
  - id: C004
    name: Bundle Linter
    responsibility: "Runs a mechanical first pass over a `docs/` tree — logical-ID format/uniqueness/no-reuse, backlink bidirectionality, empty headings, requirements with no linked risk, and CR tree-side placement — before human judgment is applied in the Judge loop."
    fulfills: [O002-R003]
    relationships:
      - to: C002
        note: "encodes the rules defined there as automated checks."

records:
  - id: PDR001
    kind: pdr
    name: Risk Over ODI Opportunity Scoring
    slug: risk-over-odi-scoring
    affects: [product]
    summary: "Intent expresses unmet customer needs as risks (likelihood × impact) tied to an outcome, rather than adopting ODI's importance/satisfaction opportunity score."
    context: "Intent's product vocabulary otherwise follows Ulwick/ODI (jobs, outcomes, needs-first sequencing). ODI ranks outcomes by an opportunity score (importance − satisfaction) to prioritize where to invest. Intent needed a way to carry \"what's unmet and why it matters\" all the way down to engineering-facing requirements, so that a requirement's existence is traceable to a specific customer-facing condition rather than only to a ranked outcome."
    options:
      - "Adopt ODI's importance/satisfaction opportunity score on outcomes, and let requirements cite the underserved outcome directly: keeps closer fidelity to ODI, but leaves no explicit link between a requirement and the specific condition it addresses — a requirement can cite a low-scoring outcome without stating what actually threatens it."
      - "Add Risk as a first-class element between outcome and requirement, expressed as likelihood × impact, and require every requirement to name the risk it mitigates: adds a vocabulary term beyond ODI, but makes the outcome → requirement mitigation trace legible."
    decision: "Chose Risk as a first-class element. A requirement traces to a named risk, and a risk traces to a named outcome — a requirement with no linked risk is recognizable as a feature request, not a requirement. ODI's scoring ranks outcomes relative to each other for prioritization; Intent's risk model instead states, for each outcome, what could go wrong and how a requirement addresses it, which is the trace this framework exists to keep intact."
    consequences:
      - "Every requirement must name at least one risk; the bundle linter flags a requirement with no linked risk as a feature-request smell."
      - "Intent does not produce a ranked backlog or opportunity score the way ODI does — prioritizing across outcomes is out of scope and must come from elsewhere."

  - id: ADR001
    kind: adr
    name: Separate Tier Templates
    slug: separate-tier-templates
    affects: [C003]
    summary: "Requirement, outcome, and component each ship two template files — one per tier (Tier-1 own-document, Tier-2 own-directory) — instead of a single merged template with conditional sections."
    context: "The Tier-1 and Tier-2 templates for the same element type share most of their body (same headings, same minimal pattern, same record backlink sections); only link depth and one added subsection differ. Keeping them as separate files risks the two copies drifting out of sync as one is edited and the other isn't."
    options:
      - "Merge each pair into a single template file with conditional/optional blocks marked for Tier-2-only content: removes the duplication, but adds a second markup system (conditional blocks) on top of the tier system Intent already teaches."
      - "Keep both files, and add a header comment on the Tier-2 file stating exactly how it differs from its Tier-1 sibling, with a note to keep the shared body in sync: duplication remains, but each file stays a flat, copy-paste-ready skeleton."
    decision: "Kept both files with the delta called out in a header comment on the Tier-2 variant. A merged template would need its own notation for \"this block is Tier-2 only,\" which is one more thing for an assistant to interpret correctly on top of the tier system itself; two flat files stay simpler to load and fill in directly."
    consequences:
      - "The two files can still drift — the header comment is a documentation aid, not an enforced constraint; nothing currently checks that the shared body of a Tier-1/Tier-2 pair stays in sync."
      - "Authors get a complete, ready-to-fill file per tier with no conditional markup to interpret."
